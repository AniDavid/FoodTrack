<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Track - Mobile Preview</title>
  <style>
    :root {
      --bg: #f7f3ff;
      --card: #ffffff;
      --primary: #b39ae8;
      --primary-dark: #9a84d9;
      --accent: #dacdff;
      --text: #362d4d;
      --muted: #72658e;
      --line: #efe7ff;
      --danger: #f0a8a8;
      --shadow: 0 12px 30px rgba(125, 102, 176, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 0;
    }

    .phone {
      width: 390px;
      min-height: 844px;
      background: linear-gradient(180deg, #faf7ff 0%, #f2ecff 100%);
      border-radius: 32px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.04);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 10px;
      font-size: 12px;
      font-weight: bold;
      color: var(--text);
    }

    .header {
      padding: 0 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin: 0;
    }

    .today-pill {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: bold;
      font-size: 0.82rem;
      box-shadow: 0 8px 20px rgba(179,154,232,0.22);
    }

    .month-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 14px;
    }

    .month-label {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }

    .nav {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 10px;
      font-size: 1rem;
      color: var(--text);
    }

    .card {
      background: var(--card);
      margin: 0 16px 16px;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.03);
    }

    .section-title {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0 0 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .quick-form {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 700;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-size: 1rem;
      background: #fbfcfb;
      color: var(--text);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary-btn {
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 12px 18px rgba(179,154,232,0.2);
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      padding-top: 8px;
    }

    .day-name {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      padding-bottom: 6px;
    }

    .day {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-radius: 12px;
      border: 1px solid transparent;
      background: #f6f7f6;
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 600;
    }

    .day.empty { background: transparent; border-color: transparent; }
    .day.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 8px 16px rgba(179,154,232,0.2);
    }
    .day.has-entry::after {
      content: "";
      position: absolute;
      bottom: 7px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,179,71,0.12);
    }

    .bottom-sheet {
      background: white;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -10px 26px rgba(0,0,0,0.08);
      margin-top: 6px;
      padding: 14px 16px 20px;
    }

    .sheet-handle {
      width: 52px;
      height: 5px;
      background: #dfe7df;
      border-radius: 999px;
      display: block;
      margin: 0 auto 14px;
    }

    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
    }

    .log-item strong { display: block; }
    .log-item small { color: var(--muted); }

    .tiny-actions {
      display: flex;
      gap: 8px;
    }

    .tiny-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: none;
      color: white;
      font-weight: bold;
    }

    .edit { background: #3a8ef6; }
    .delete { background: var(--danger); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span>◔◔◔</span>
    </div>

    <header class="header">
      <h1 class="title">Food Track</h1>
      <button class="today-pill">היום</button>
    </header>

    <div class="month-row">
      <div class="month-label">אוגוסט 2026</div>
      <div class="nav">
        <button class="nav-btn">←</button>
        <button class="nav-btn">→</button>
      </div>
    </div>

    <section class="card">
      <p class="section-title">הוספת רשומה מהירה</p>
      <div class="quick-form">
        <div class="field">
          <label>מזון</label>
          <select>
            <option>apple</option>
            <option>banana</option>
            <option>rice</option>
          </select>
        </div>

        <div class="row-2">
          <div class="field">
            <label>סוג</label>
            <select>
              <option>fruit</option>
              <option>vegetable</option>
              <option>protein</option>
            </select>
          </div>

          <div class="field">
            <label>כמות</label>
            <input type="number" value="2" />
          </div>
        </div>

        <div class="row-2">
          <div class="field">
            <label>יחידה</label>
            <select>
              <option>pieces</option>
              <option>grams</option>
              <option>cups</option>
            </select>
          </div>

          <div class="field">
            <label>קלוריות</label>
            <input type="number" value="160" />
          </div>
        </div>

        <button class="primary-btn">הוסף רשומה</button>
      </div>
    </section>

    <section class="card">
      <p class="section-title">לוח חודש</p>
      <div class="calendar">
        <div class="day-name">א</div>
        <div class="day-name">ב</div>
        <div class="day-name">ג</div>
        <div class="day-name">ד</div>
        <div class="day-name">ה</div>
        <div class="day-name">ש</div>
        <div class="day-name">ש</div>

        <div class="day empty"></div>
        <div class="day empty"></div>
        <div class="day">1</div>
        <div class="day">2</div>
        <div class="day">3</div>
        <div class="day">4</div>
        <div class="day">5</div>

        <div class="day">6</div>
        <div class="day">7</div>
        <div class="day">8</div>
        <div class="day active">9</div>
        <div class="day has-entry">10</div>
        <div class="day">11</div>
        <div class="day">12</div>

        <div class="day">13</div>
        <div class="day has-entry">14</div>
        <div class="day">15</div>
        <div class="day">16</div>
        <div class="day">17</div>
        <div class="day">18</div>
        <div class="day">19</div>

        <div class="day">20</div>
        <div class="day">21</div>
        <div class="day">22</div>
        <div class="day">23</div>
        <div class="day">24</div>
        <div class="day has-entry">25</div>
        <div class="day">26</div>

        <div class="day">27</div>
        <div class="day">28</div>
        <div class="day">29</div>
        <div class="day">30</div>
        <div class="day">31</div>
        <div class="day empty"></div>
        <div class="day empty"></div>
      </div>
    </section>

    <section class="bottom-sheet">
      <span class="sheet-handle"></span>
      <p class="section-title">יומן אוכל · 9 באוגוסט</p>

      <div class="log-item">
        <div>
          <strong>apple</strong>
          <small>fruit • 2 pieces • 160 kcal</small>
        </div>
        <div class="tiny-actions">
          <button class="tiny-btn edit">✎</button>
          <button class="tiny-btn delete">✕</button>
        </div>
      </div>

      <div class="log-item">
        <div>
          <strong>rice</strong>
          <small>carb • 1 cup • 210 kcal</small>
        </div>
        <div class="tiny-actions">
          <button class="tiny-btn edit">✎</button>
          <button class="tiny-btn delete">✕</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
